spring.application.name=rentalTool-BackEnd


#Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rentaltooldb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#rsa
rsa.rsa-private-key=classpath:certs/private.pem
rsa.rsa-public-key=classpath:certs/public.pem

# Konfiguracja przechowywania plików
file.upload-dir=./uploads/images

# Maksymalny rozmiar plików
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

